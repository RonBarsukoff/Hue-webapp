<h1>Instellingen</h1>
<div class="card">
  <label for="bridge-ip">IP-adres van de bridge</label>
  <input id="bridge-ip" type="text" placeholder="192.168.1.10" autocomplete="off" />
  <label for="api-key">API-sleutel</label>
  <input id="api-key" type="text" placeholder="Vul in of haal op met de knop hieronder" autocomplete="off" />
  <div class="buttons">
    <button id="connect">Verbinden</button>
    <button id="get-key" class="secondary">API-sleutel ophalen</button>
  </div>
  <div id="status" class="status"></div>
  <p class="sub">Sleutel ophalen: druk eerst op de knop op de bridge en klik dan binnen 30 seconden op "API-sleutel ophalen".</p>
</div>
